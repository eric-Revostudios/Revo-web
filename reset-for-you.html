<!--
  Página puente de la campaña «Reset for You» (invitaciones de miembros, oct-2026).
  Es el link que va en el WhatsApp que el equipo manda a cada persona invitada.
  Existe por la VISTA PREVIA: WhatsApp la construye con las etiquetas og: de la
  página enlazada, y con el link directo de Momence salía su logo. Aquí la
  vista previa es de REVO, y la persona pasa sola a la reserva de Momence.
  El salto se hace por JavaScript (y no con una redirección del servidor) a
  propósito: quien arma la vista previa no ejecuta JavaScript, así que lee
  estas etiquetas en vez de seguir hasta Momence.
-->
